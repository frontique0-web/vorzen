<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vorzen Stand — Tasarla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141414; --ink2:#5d5a55; --ink3:#9a968f; --line:#e7e3dc; --paper:#fbfaf7; --card:#ffffff;
  --accent:#141414; --ok:#1f8f4e;
  --pad: max(14px, env(safe-area-inset-left));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:Manrope,system-ui,sans-serif}
html[lang=ar] body{font-family:"IBM Plex Sans Arabic",Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:fixed;inset:0;display:grid;grid-template-columns:1fr 400px;grid-template-rows:100%;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 38%, #ffffff 0%, #f3f0ea 55%, #e8e3da 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.top{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px;pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.wm{height:15px;width:auto;fill:var(--ink);display:block}
.lang{display:flex;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border:1px solid var(--line);
  border-radius:999px;padding:3px}
.lang button{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;color:var(--ink2);letter-spacing:.02em}
.lang button.on{background:var(--ink);color:#fff}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  font-size:12.5px;color:var(--ink2);background:rgba(255,255,255,.8);backdrop-filter:blur(8px);
  border:1px solid var(--line);padding:8px 14px;border-radius:999px;transition:opacity .5s;white-space:nowrap;z-index:3}
.hint svg{width:16px;height:16px}
.hint.gone{opacity:0;pointer-events:none}
.tools{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:3}
html[dir=rtl] .tools{right:auto;left:18px}
.tool{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.85);border:1px solid var(--line);
  display:grid;place-items:center;backdrop-filter:blur(8px)}
.tool svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.loader{position:absolute;inset:0;display:grid;place-items:center;z-index:4;transition:opacity .6s}
.loader.done{opacity:0;pointer-events:none}
.loader .bar{width:140px;height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px}
.loader .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.loader .in{display:flex;flex-direction:column;align-items:center}
.loader .wm{height:13px;opacity:.85}

/* ---------- panel ---------- */
.panel{background:var(--card);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;padding:26px 26px 22px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
html[lang=ar] .eyebrow{letter-spacing:0}
h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
html[lang=ar] h1{letter-spacing:0;font-size:25px;line-height:1.35}
.sub{font-size:13.5px;color:var(--ink2);line-height:1.5}
.zones{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:20px;margin:18px 0}
.zone h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;margin-bottom:4px}
.zone h3 .val{font-weight:500;color:var(--ink2);font-size:12.5px}
.zone p{font-size:12px;color:var(--ink3);margin-bottom:10px}
.sw{display:flex;flex-wrap:wrap;gap:9px}
.s{position:relative;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s}
.s:hover{transform:scale(1.08)}
.s.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.6px solid var(--ink)}
.s.gold{background:linear-gradient(135deg,#e6c97a,#b98f35 55%,#e2c06c)!important}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;text-align:start;display:flex;gap:10px;align-items:center;transition:border-color .15s}
.opt.on{border-color:var(--ink)}
.opt svg{flex:none;width:34px;height:42px}
.opt b{display:block;font-size:13px}
.opt span{display:block;font-size:11.5px;color:var(--ink3);line-height:1.35;margin-top:2px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:16px;background:var(--ink);color:#fff;
  font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s, background .15s}
.cta:hover{background:#000;transform:translateY(-1px)}
.cta svg{width:20px;height:20px;fill:#25d366}
.note{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:10px;line-height:1.45}
.code{font-feature-settings:"tnum";color:var(--ink2);font-weight:600}
.tabs{display:none}

/* ---------- mobile ---------- */
@media (max-width:820px){
  .app{grid-template-columns:100%;grid-template-rows:minmax(0,1fr) auto}
  .top{padding:12px 14px}
  .wm{height:12px}
  .hint{bottom:28px;font-size:12px;padding:7px 12px}
  .tools{right:12px;bottom:26px}
  html[dir=rtl] .tools{left:12px}
  .tool{width:36px;height:36px}
  .panel{border:0;border-top:1px solid var(--line);padding:12px 14px 12px;border-radius:20px 20px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.05);margin-top:-16px;position:relative;z-index:5}
  .head,.sub,.eyebrow{display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#f3f1ec;border-radius:12px;padding:3px;margin-bottom:12px}
  .tabs button{font-size:12px;font-weight:600;padding:8px 2px;border-radius:9px;color:var(--ink2);line-height:1.15}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .zones{margin:0 0 12px;gap:0;display:block;min-height:96px}
  .zone{display:none}
  .zone.on{display:block}
  .zone h3{margin-bottom:2px}
  .zone p{margin-bottom:9px}
  .sw{flex-wrap:nowrap;overflow-x:auto;padding:5px 5px 6px;margin:-5px -5px 0;scrollbar-width:none;gap:10px}
  .sw::-webkit-scrollbar{display:none}
  .s{flex:none;width:34px;height:34px}
  .opt{padding:8px 10px}
  .opt svg{width:28px;height:34px}
  .cta{height:50px;font-size:14.5px}
  .note{margin-top:7px;font-size:11px}
}
@media (max-width:820px) and (max-height:640px){ .zone p{display:none} .zones{min-height:70px} }

const T = {

/* ---------- UI ---------- */
const $ = (s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function buildSwatches(){
  for (const z of Object.keys(ZONES)){
    const box = $('#sw_'+z); box.innerHTML='';
    for (const k of ZONES[z]){
      const c=byK[k], b=document.createElement('button');
      b.className='s'+(c.gold?' gold':''); b.style.background=c.hex; b.dataset.k=k;
      b.onclick=()=>{ state[z]=k; refresh(); setColor(z,k); };
      box.appendChild(b);
    }
  }
}
function code(){ return 'VZ-'+state.main+state.shop+state.trim+(state.ring?'1':'0'); }
function refresh(){
  const L=T[state.lang];
  document.documentElement.lang=state.lang; document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
  $$('[data-t]').forEach(e=>{ const v=L[e.dataset.t]; if(typeof v==='string') e.textContent=v; });
  $$('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===state.lang));
  for (const z of Object.keys(ZONES)){
    $$('#sw_'+z+' .s').forEach(b=>{ b.classList.toggle('on',b.dataset.k===state[z]); b.title=byK[b.dataset.k][state.lang]; b.setAttribute('aria-label',byK[b.dataset.k][state.lang]); });
    $('#v_'+z).textContent=byK[state[z]][state.lang];
  }
  $$('.opt').forEach(b=>b.classList.toggle('on',(b.dataset.ring==='1')===state.ring));
  $('#code').textContent=code();
  const n=k=>byK[k][state.lang];
  const msg=L.msg({main:n(state.main),shop:n(state.shop),trim:n(state.trim),logo:state.ring?L.ring:L.plain,code:code()});
  $('#cta').href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
  document.title = state.lang==='ar' ? 'فورزن — صمّم ستاندك' : 'Vorzen Stand — Tasarla';
}
$$('.lang button').forEach(b=>b.onclick=()=>{state.lang=b.dataset.l; refresh();});
$$('.opt').forEach(b=>b.onclick=()=>{state.ring=b.dataset.ring==='1'; refresh(); applyRing(); focusLogo();});
$$('#tabs button').forEach(b=>b.onclick=()=>{
  $$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.zone').forEach(x=>x.classList.toggle('on',x.dataset.z===b.dataset.z));
  if(b.dataset.z==='logo') focusLogo();
});
buildSwatches(); refresh();

/* ---------- 3D ---------- */
const canvas=$('#c'), stage=$('#stage');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.55;
const cam=new THREE.PerspectiveCamera(30,1,0.01,10);
const controls=new OrbitControls(cam,canvas);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.enablePan=false;
controls.minDistance=0.26; controls.maxDistance=0.85; controls.maxPolarAngle=Math.PI*0.53; controls.minPolarAngle=Math.PI*0.12;
controls.rotateSpeed=0.8;

const key=new THREE.DirectionalLight(0xffffff,2.1); key.position.set(0.35,0.7,0.55);
key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.radius=6; key.shadow.bias=-0.0004;
Object.assign(key.shadow.camera,{left:-0.25,right:0.25,top:0.25,bottom:-0.25,near:0.1,far:2});
scene.add(key);
const fill=new THREE.DirectionalLight(0xfff4e8,0.6); fill.position.set(-0.6,0.3,0.2); scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,0.8); rim.position.set(-0.2,0.5,-0.7); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff,0xe9e2d6,0.55));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShadowMaterial({opacity:0.16}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const mats={};
function mat(z){
  const m=new THREE.MeshStandardMaterial({roughness:0.5,metalness:0});
  m.userData.target=new THREE.Color(); m.userData.tm=0; m.userData.tr=0.5; return m;
}
['main','shop','trim'].forEach(z=>mats[z]=mat(z));
function look(k){ const c=byK[k];
  return c.gold ? {col:'#e3c172',metal:0.6,rough:0.3} : {col:c.hex,metal:0,rough: k==='B'?0.42:0.52}; }
function setColor(z,k,now){
  const m=mats[z], L=look(k);
  m.userData.target.set(L.col).convertSRGBToLinear(); m.userData.tm=L.metal; m.userData.tr=L.rough;
  if(now){ m.color.copy(m.userData.target); m.metalness=L.metal; m.roughness=L.rough; }
}
['main','shop','trim'].forEach(z=>setColor(z,state[z],true));

const nodes={};
function applyRing(){
  if(!nodes.ring_shop) return;
  ['ring_shop','ring_trim'].forEach(n=>nodes[n].visible=state.ring);
  ['plain_shop','plain_trim'].forEach(n=>nodes[n].visible=!state.ring);
}
const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const GLB=Uint8Array.from(atob(document.getElementById('glb').textContent.trim()),c=>c.charCodeAt(0)).buffer;
loader.parse(GLB,'', g=>{
  const root=g.scene;
  root.traverse(o=>{
    if(o.isMesh){
      let p=o, name=''; while(p){ if(/_(main|shop|trim)$/.test(p.name)){ name=p.name; break; } p=p.parent; }
      const z=name.endsWith('_main')?'main':name.endsWith('_shop')?'shop':'trim';
      o.material=mats[z]; o.castShadow=true; o.receiveShadow=true;
      const g0=o.geometry; g0.deleteAttribute('normal');
      o.geometry=toCreasedNormals(g0, 0.6);
    }
  });
  root.traverse(o=>{ for(const n of ['common_main','common_shop','common_trim','ring_shop','ring_trim','plain_shop','plain_trim']) if(o.name===n) nodes[n]=o; });
  scene.add(root); applyRing();
  $('#loader').classList.add('done');
  intro=0;
}, e=>console.error(e));

/* camera views */
const TARGET=new THREE.Vector3(0,0.082,0);
const HOME={az:0.42, pol:1.18, r:0.56};
const LOGO={az:0.14, pol:1.30, r:0.46};
function sph(v){ return new THREE.Vector3(Math.sin(v.pol)*Math.sin(v.az), Math.cos(v.pol), Math.sin(v.pol)*Math.cos(v.az)).multiplyScalar(v.r).add(TARGET); }
let fly=null, intro=-1, interacted=false, idle=0;
function flyTo(v, tgt=TARGET){ fly={from:cam.position.clone(), to:sph(v), t0:performance.now(), d:900, ft:controls.target.clone(), tt:tgt.clone()}; }
function focusLogo(){ flyTo(LOGO, new THREE.Vector3(0.03,0.10,0.0)); }
$('#reset').onclick=()=>flyTo(HOME);
function fit(){
  const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false);
  cam.aspect=w/h; cam.fov = 30; cam.updateProjectionMatrix();
  const hf=Math.atan(Math.tan(THREE.MathUtils.degToRad(15))*cam.aspect);
  HOME.r = Math.max(0.56, 0.118/Math.tan(hf)); LOGO.r = Math.max(0.46, 0.08/Math.tan(hf));
  controls.maxDistance = Math.max(0.85, HOME.r*1.4);
}
addEventListener('resize',fit); fit();
cam.position.copy(sph({az:HOME.az+1.2,pol:1.05,r:HOME.r*1.25})); controls.target.copy(TARGET);
canvas.addEventListener('pointerdown',()=>{ interacted=true; idle=0; fly=null; $('#hint').classList.add('gone'); });

const clock=new THREE.Clock();
function ease(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  for(const z in mats){ const m=mats[z], u=m.userData, k=1-Math.pow(0.0008,dt);
    m.color.lerp(u.target,k); m.metalness+= (u.tm-m.metalness)*k; m.roughness+=(u.tr-m.roughness)*k; }
  if(intro===0){ flyTo(HOME); fly.d=1700; intro=1; }
  if(fly){ const t=Math.min((performance.now()-fly.t0)/fly.d,1), e=ease(t);
    cam.position.lerpVectors(fly.from,fly.to,e); controls.target.lerpVectors(fly.ft,fly.tt,e); if(t>=1) fly=null; }
  else if(!interacted && intro===1){ controls.autoRotate=true; controls.autoRotateSpeed=0.6; }
  if(interacted){ controls.autoRotate=false; idle+=dt; }
  controls.update(); renderer.render(scene,cam);
});
window.__vz={state,mats,nodes,cam,controls,flyTo,HOME,LOGO};
</script>
</body>
</html>
